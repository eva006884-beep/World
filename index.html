   a.push(r.docs[0].data().nick);P.fr=a.join(',');save({fr:P.fr});q('#fn').value='';A.friends()}catch(e){m.textContent='Не удалось, попробуйте позже'}},
 delf(n){P.fr=(P.fr||'').split(',').filter(x=>x&&x!=n).join(',');save({fr:P.fr});A.friends()},
 async edit(){show('ed');const C=q('#edc');if(!own())return C.textContent='Нет прав';if(!db||loc)return C.innerHTML='<small>Панель работает только с сервером</small>';C.textContent='Загрузка…';
  try{const[s,v,b,r]=await Promise.all([db.collection('players').orderBy('xp','desc').limit(100).get(),db.doc('cfg/srv').get(),db.collection('bans').get(),db.collection('ranks').get()]);
   const off=v.exists&&v.data().off,bn={},rr={};b.docs.forEach(d=>{if(d.data().until>Date.now())bn[d.id]=1});r.docs.forEach(d=>{rr[d.id]=d.data().rank});
   C.innerHTML=`<div class=r><b>Сервер: ${off?'🔴 ВЫКЛ':'🟢 ВКЛ'}</b><button class="${off?'':'red'}" onclick="UI.ea('','srv',${off?0:1})">${off?'Включить':'Выключить'}</button></div><small>Когда сервер выключен, входить может только владелец. Пароли хранятся в Firebase только в виде хеша, увидеть их нельзя.</small><h4>Аккаунты (${s.docs.length})</h4>`+s.docs.map(d=>{const p=d.data(),id=d.id,o=id==ownerUid,a=rr[id]=='admin';return`<div class=r><span>${esc(p.nick)} ${bad(rk(p,id))}${bn[id]?' 🚫':''}<br><small>Ур. ${lv(p.xp||0)} · ${p.xp||0} XP · игр ${p.games||0} · побед ${p.wins||0}</small></span>${o?'':`<span><button onclick="UI.ea('${id}','rank',${a?0:1})">${a?'−Админ':'+Админ'}</button><button onclick="UI.ea('${id}','ban',${bn[id]?0:1})">${bn[id]?'Разбан':'Бан'}</button><button onclick="UI.ea('${id}','xp')">XP</button></span>`}</div>`}).join('')}catch(e){C.textContent='Ошибка загрузки: проверьте правила Firestore'}},
 async ea(id,k,v){if(!own())return;try{
   if(k=='srv')await db.doc('cfg/srv').set({off:v,by:uid,at:Date.now()});
   else if(k=='rank')await db.doc('ranks/'+id).set({rank:v?'admin':'player',by:uid,at:Date.now()});
   else if(k=='ban')await db.doc('bans/'+id).set({until:v?9e15:0,by:uid,at:Date.now()});
   else if(k=='xp'){const x=prompt('Новое значение XP');if(x==null||isNaN(+x))return;await db.doc('players/'+id).update({xp:Math.max(0,+x|0)})}
  }catch(e){toast('Нет прав на запись: проверьте правила Firestore')}A.edit()},
 gadm(){q('#gad').classList.remove('h');q('#g').classList.add('h');const C=q('#gadc');if(!adm()||!G)return C.textContent='Нет прав или игра не идёт';
  const you=G.cs[me],mk=(l,f)=>`<button onclick="UI.gact('${f}')">${l}</button>`;
  C.innerHTML=(OBS?'':`<div class=r><b>Моя страна: ${esc(you.n)}</b></div><div class=r>${mk('+1000M','money')}${mk('+100 ПВ','pp')}${mk('+50 рекрутов','man')}${mk('Полное HP городам','hp')}${mk('Мгновенная победа','win')}</div>`)
   +`<h4>Страны</h4>`+G.cs.filter(c=>c.alive).map(c=>`<div class=r><span>${esc(c.n)}${c.i==me?' (вы)':''}</span><span>${c.i==me?'':mk('💥 Разгромить','kill:'+c.i)}</span></div>`).join('')
   +(ON.on&&!isHost()?'<small>В онлайн-партии часть действий выполняет только хост</small>':'')},
 gact(a){if(!adm()||!G)return;const[k,arg]=a.split(':'),c=G.cs[me];
  if(k=='money')c.money+=1000;else if(k=='pp')c.pp+=100;else if(k=='man')c.man+=50;
  else if(k=='hp')G.ct.forEach(t=>{if(t.own==me)t.hp=t.mx});
  else if(k=='win'){over=1;spd=0;toast('Админ-победа',7000)}
  else if(k=='kill'){const i=+arg;G.ct.forEach(t=>{if(t.own==i)t.own=me});G.dv=G.dv.filter(d=>d.o!=i);G.cs[i].alive=false;lg('Админ разгромил '+G.cs[i].n)}
  pn();top_();UI.gadm()},
 async players(){show('pl');const L=q('#pll');L.textContent='Загрузка…';if(!db)return L.textContent='Список игроков доступен только онлайн (через claude.ai)';
  try{const s=await db.collection('players').orderBy('xp','desc').limit(50).get();L.innerHTML=s.docs.map((d,i)=>{const p=d.data();return`<div class=r><span>${i+1}. ${esc(p.nick)} ${bad(rk(p,d.id))}</span><small>Ур. ${lv(p.xp||0)} · игр: ${p.games||0} · побед: ${p.wins||0}</small></div>`}).join('')||'Пока никого'}catch(e){L.textContent='Не удалось загрузить'}},
 settings(){show('sg');const s=P?P.set:{fps:fpsOn?1:0,theme:'auto',df:1},T=[['auto','Авто'],['dark','Тёмная'],['light','Светлая']];
  q('#sgb').innerHTML=`<div class=r><span>FPS-счётчик</span><button class="${s.fps?'on':''}" onclick="UI.set('fps',${s.fps?0:1})">${s.fps?'вкл':'выкл'}</button></div><div class=r><span>Тема</span><span>${T.map(([k,n])=>`<button class="${s.theme==k?'on':''}" onclick="UI.set('theme','${k}')">${n}</button>`).join('')}</span></div><div class=r><span>Сложность</span><span>${DFN.map((n,i)=>`<button class="${s.df==i?'on':''}" onclick="UI.set('df',${i})">${n}</button>`).join('')}</span></div>`+(P?'<div class=r><button onclick="UI.logout()">🚪 Выйти из аккаунта</button></div>':'')},
 set(k,v){if(P){P.set[k]=v;save({set:P.set});applySet()}else{if(k=='fps')setFps(!!v);if(k=='theme')document.documentElement.dataset.theme=v;if(k=='df')df=v}A.settings()},
 cons(){const par=q('#g').classList.contains('h')?q('#menu'):q('#mw');if(!cel){cel=document.createElement('div');cel.id='cons';cel.innerHTML='<div class=rw><b style="flex:1">⌨ Команды</b><button onclick="UI.cons()">✕</button></div><div class=rw><input enterkeyhint=send autocomplete=off autocapitalize=off spellcheck=false placeholder="/help" onkeydown="if(event.key==\'Enter\')UI.run()"><button onclick="UI.run()">↵</button></div><div class=lg></div>'}
  if(cel.parentNode){cel.remove();return}par.appendChild(cel);cel.querySelector('input').focus()},
 async run(){const i=cel.querySelector('input'),L=cel.querySelector('.lg'),line=i.value.trim();i.value='';if(!line)return;const out=m=>{L.textContent+=m+'\n';L.scrollTop=1e9};out('> '+line);
  const a=line.split(/\s+/),c=a[0].toLowerCase();
  if(c[0]!='/')return out('Команды начинаются с /. Список: /help');
  if(c=='/help')return out(adm()?'/fps on|off\n/lp <ник> <admin|player>\n/ban <ник> <30m|2h|7d|perm>':'/fps on|off');
  if(c=='/fps'){const v=(a[1]||'').toLowerCase();if(v!='on'&&v!='off')return out('Использование: /fps on|off');setFps(v=='on');return out('FPS-счётчик: '+v)}
  if(c=='/lp'||c=='/ban'){if(!adm())return out('Нет прав: команда только для админов');if(!db)return out('Недоступно в гостевом режиме');
   const nk=(a[1]||'').toLowerCase();if(!nk||!a[2])return out(c=='/lp'?'Использование: /lp <ник> <admin|player>':'Использование: /ban <ник> <30m|2h|7d|perm>');
   try{const s=await db.collection('players').where(FB.ok?'em':'nl','==',FB.ok?FB.mail(nk):nk).limit(1).get();if(s.empty)return out('Игрок не найден: '+a[1]);const id=s.docs[0].id,nm=s.docs[0].data().nick;
    if(c=='/lp'){if(nm.toLowerCase()=='tulkin')return out('Ранг Tulkin изменить нельзя');const r=a[2].toLowerCase();if(r!='admin'&&r!='player')return out('Ранг: admin или player');await db.doc('ranks/'+id).set({rank:r,by:uid,at:Date.now()});return out(nm+' → '+r)}
    if(id==uid)return out('Нельзя заблокировать себя');if(ranks[id]=='admin'||nm.toLowerCase()=='tulkin')return out('Нельзя заблокировать админа: сначала /lp '+nm+' player');
    const m=/^(\d+)([mhd])$/.exec(a[2].toLowerCase());let u;if(a[2].toLowerCase()=='perm')u=9e15;else if(m)u=Date.now()+(+m[1])*{m:6e4,h:36e5,d:864e5}[m[2]];else return out('Время: 30m, 2h, 7d или perm');
    await db.doc('bans/'+id).set({until:u,by:uid,at:Date.now(),nick:nm});return out(nm+' заблокирован '+fmt(u))}
   catch(e){return out('Ошибка записи: для /lp и /ban нужна роль редактора страницы')}}
  out('Неизвестная команда. /help')}};
(async()=>{if(FB.ok){db=FB.db;try{if(await FB.restore()){uid=FB.uid;const p=await db.doc('players/'+uid).get();if(p.exists){P=p.data();await enter()}}}catch(e){msg('Нет связи с сервером')}return}
try{db=await claude.use('db');usr=await claude.use('user');uid=usr&&await usr.id();ed=usr?await usr.canEdit():0}catch(e){}if(!db||!uid){db=null;loc=1;msg('Локальный режим: аккаунт хранится только в этом браузере, онлайн недоступен');try{if(localStorage.getItem('ws_lsess')){const a=JSON.parse(localStorage.getItem('ws_acc')||'null');if(a){P=a;await enter()}}}catch(e){}}else try{const s=(await db.doc('data/users/'+uid+'/sess').get()).data();if(s&&s.on){const p=await db.doc('players/'+uid).get();if(p.exists){P=p.data();await enter()}}}catch(e){}})();
const _s=start;start=function(){_s();paid=0;if(P){P.games=(P.games||0)+1;save({games:P.games})}q('#gab').classList.toggle('h',!UI.adm())};
const addXp=(n,w)=>{if(!P)return;P.xp=(P.xp||0)+n;if(w)P.wins=(P.wins||0)+1;save({xp:P.xp,wins:P.wins||0});prof()};
setInterval(()=>{if(P&&G&&!banned&&!q('#g').classList.contains('h'))addXp(3)},6e4);
setInterval(()=>{if(G&&over&&!ON.on&&!paid&&P&&!OBS){paid=1;const w=G.ct.filter(t=>t.own==me).length>G.ct.length*.7;addXp(w?100:20,w)}},2e3);
setInterval(()=>{if(P&&!banned)save({last:Date.now()})},6e4);setInterval(()=>{if(!q('#fr').classList.contains('h'))A.friends()},2e4);
let fc=0,ft=performance.now();(function f(){fc++;const n=performance.now();if(n-ft>=500){if(fpsOn)q('#fps').textContent=Math.round(fc*1000/(n-ft))+' FPS';fc=0;ft=n}requestAnimationFrame(f)})();
return A})();
